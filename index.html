<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a0f14">
  <title>Last Call Live!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238e1b1b' stroke='%23f2c14e' stroke-width='4'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23f2c14e' font-family='Impact'%3ELC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">LAST CALL LIVE!</div>
    <span class="spacer"></span>
    <span id="tb-room" class="badge hidden"></span>
    <button class="icon-btn hidden" id="tb-tally" data-do="tally" aria-label="Drink tally">🍺</button>
    <button class="icon-btn" id="tb-sound" data-do="sound" aria-label="Sound effects off" aria-pressed="false">🔇</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="callout" class="callout" role="alert" data-do="closeCallout"></div>
  <div id="celebrate" class="celebrate" data-do="closeCelebrate"></div>
  <div id="sheet" class="sheet" data-do="closeSheet"><div class="sheet-body" id="sheet-body" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript>Last Call Live! needs JavaScript.</noscript>
</body>
</html>
